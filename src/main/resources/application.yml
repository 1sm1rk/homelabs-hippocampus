spring:
  application:
    name: homelabs-hippocampus
  ai:
    mcp:
      server:
        # The transport itself (protocol STREAMABLE, type SYNC) is the starter's
        # contract — homelabs.mcp contributes those defaults at lowest precedence.
        name: hippocampus
        version: 0.0.1
        annotation-scanner:
          enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/hippocampus
    username: hippocampus
    password: hippocampus
  flyway:
    enabled: true

# MCP foundation (ADR 0006): the homelabs-mcp starter wires the OAuth 2.1 resource
# server (issuer + audience binding) and the Protected Resource Metadata document
# (RFC 9728, served at /.well-known/oauth-protected-resource). The HIPPOCAMPUS_*
# env vars stay backward compatible — they map onto the starter namespace.
homelabs:
  mcp:
    issuer: ${HIPPOCAMPUS_ISSUER_URI:http://localhost:8091/realms/hippocampus}
    resource: ${HIPPOCAMPUS_RESOURCE:http://localhost:8090/mcp}
    resource-metadata-url: ${HIPPOCAMPUS_RESOURCE_METADATA_URL:http://localhost:8090/.well-known/oauth-protected-resource}

hippocampus:
  ltm:
    # Stage 1 LTM (AP-6): chunking tuned for MiniLM's 128-token window (ADR 0005),
    # embedding backend selection and model files. The model is ~449 MB and NOT
    # committed — run scripts/install-minilm.sh to fetch it. Provider selection:
    # 'onnx' (default, eager-loaded at startup) or 'mock' (deterministic, tests).
    chunking:
      target-tokens: 115
      overlap-tokens: 24
      hard-cap-tokens: 128
    embedding:
      provider: onnx
      # Loose coupling (ADR 0005, owner decision 2026-10-13): the model artifacts are
      # deployment data OUTSIDE the repo. Paths are absolute and overridable via env
      # (e.g. HIPPOCAMPUS_LTM_EMBEDDING_MODEL_PATH), defaulting to the XDG data dir.
      # Never working-directory-relative model paths.
      model-path: ${user.home}/.local/share/hippocampus/models/multilingual-MiniLM/model.onnx
      tokenizer-path: ${user.home}/.local/share/hippocampus/models/multilingual-MiniLM/tokenizer.json
      dimension: 384

server:
  port: 8090

logging:
  level:
    de.homelabs.hippocampus: DEBUG