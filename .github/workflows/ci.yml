# CI/CD for the memory service and its MCP adapter.
#
# Flow: feature branch -> pull request (verify) -> merge to main (verify +
# container image). The adapter is released from a tag: vX.Y.Z -> verify +
# GitHub Packages release.
#
# A red `verify` blocks every publish: both publish jobs declare it as a
# dependency, so nothing is ever built or released from unverified code.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# PR builds supersede each other; pushes to main or a release tag never cancel
# a running job (a cancelled run would leave a half-published release).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/1sm1rk/homelabs-hippocampus

jobs:
  # Branch protection points at exactly this job name: keep `verify` stable.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Unit tests (surefire) plus the *IT integration tests (failsafe,
      # Testcontainers). The hosted runner carries a Docker daemon; the tests
      # pull their own Postgres/pgvector image. The embedded ONNX model is not
      # needed: full-context tests run with the mock embedding provider.
      - name: mvn verify
        run: mvn -B -ntp verify

  # Every merge to main produces a ready-to-pull image: `latest` for the
  # deployment hosts, `sha-<commit>` to pin or roll back a specific build.
  publish-image:
    name: publish-image
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The Dockerfile's contract is the parent `projects/` layout as build
      # context with `homelabs-hippocampus/Dockerfile` inside it, so the
      # checkout is placed one level down from the workspace root.
      - uses: actions/checkout@v7
        with:
          path: projects/homelabs-hippocampus
      - uses: docker/setup-buildx-action@v4
      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute the short-commit tag
        id: tags
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: projects
          file: projects/homelabs-hippocampus/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ steps.tags.outputs.short_sha }}

  # Tag-driven release of the adapter artifact de.homelabs:hippocampus-mcp.
  # The pom versions stay 0.0.1-SNAPSHOT for local/dev builds; the tag is the
  # version of record and is applied to the ephemeral runner checkout only.
  publish-adapter:
    name: publish-adapter
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Resolve the release version from the tag
        id: release
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' is not a release tag; expected vX.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "adapter release: de.homelabs:hippocampus-mcp $version" >> "$GITHUB_STEP_SUMMARY"
      # Backup poms are pointless in an ephemeral checkout.
      - name: Set the module versions to the release version
        run: >-
          mvn -B -ntp versions:set
          -DnewVersion=${{ steps.release.outputs.version }}
          -DgenerateBackupPoms=false
      # The token reaches Maven only through this throwaway settings file and
      # is never echoed. The `github` server id matches the deployment
      # repository id below.
      - name: Write Maven settings for GitHub Packages
        run: |
          cat > "$RUNNER_TEMP/settings.xml" <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          XML
      # The parent pom is deployed along with the adapter (the adapter's pom
      # inherits it, so consumers need both). Tests already ran in `verify`.
      - name: Deploy the adapter to GitHub Packages
        run: |
          mvn -B -ntp -s "$RUNNER_TEMP/settings.xml" \
            -DaltDeploymentRepository="github::https://maven.pkg.github.com/1sm1rk/homelabs-hippocampus" \
            -pl hippocampus-mcp -am deploy -DskipTests
